name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage gate
        run: python -m pytest tests -v --cov=scripts --cov-report=term-missing --cov-fail-under=85

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: energy_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: energy_pipeline
      PETRINEX_MONTH: "2026-03"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dbt.txt

      - name: Create database schema
        run: psql "postgresql://postgres:ci_password@localhost:5432/energy_pipeline" -f sql/schema.sql

      - name: Run ETL pipeline end to end
        run: python run_pipeline.py

      - name: Run pipeline again to prove upserts are idempotent
        run: python run_pipeline.py

      - name: Load one real Petrinex month (about 520k rows)
        run: python run_pipeline.py --source petrinex --months ${{ env.PETRINEX_MONTH }}

      - name: Reload the same month to prove the bulk upsert is idempotent
        run: python run_pipeline.py --source petrinex --months ${{ env.PETRINEX_MONTH }}

      - name: Verify row counts and audit records
        run: |
          psql "$PGURL" -c "SELECT count(*) AS facility_rows FROM facility_production"
          psql "$PGURL" -c "SELECT source_name, status, rows_extracted, rows_loaded FROM pipeline_runs ORDER BY run_id"
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "DO \$\$ DECLARE n bigint; BEGIN SELECT count(*) INTO n FROM facility_production; IF n < 100000 THEN RAISE EXCEPTION 'expected >100k facility rows, got %', n; END IF; END \$\$;"
        env:
          PGURL: postgresql://postgres:ci_password@localhost:5432/energy_pipeline

      - name: Build and test dbt models
        run: dbt build --project-dir dbt --profiles-dir dbt

      - name: Show analytics summary
        run: psql "postgresql://postgres:ci_password@localhost:5432/energy_pipeline" -c "SELECT * FROM analytics.yearly_production_summary LIMIT 20"
