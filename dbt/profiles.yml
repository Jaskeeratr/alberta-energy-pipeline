# Connection settings come from the same POSTGRES_* environment variables
# the ETL pipeline uses (see .env.example).
alberta_energy:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'energy_pipeline') }}"
      schema: analytics
      threads: 4
