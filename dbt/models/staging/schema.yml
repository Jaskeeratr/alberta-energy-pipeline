version: 2

models:
  - name: stg_oil_production
    description: Staged crude oil production records with a derived year column.
    columns:
      - name: field_name
        tests: [not_null]
      - name: production_date
        tests: [not_null]
      - name: volume_m3
        tests: [not_null]
      - name: production_year
        tests: [not_null]

  - name: stg_gas_production
    description: Staged natural gas production records with a derived year column.
    columns:
      - name: field_name
        tests: [not_null]
      - name: production_date
        tests: [not_null]
      - name: volume_m3
        tests: [not_null]
      - name: production_year
        tests: [not_null]

  - name: stg_facility_production
    description: Staged Petrinex facility volumetric records.
    columns:
      - name: production_month
        tests: [not_null]
      - name: facility_id
        tests: [not_null]
      - name: activity_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
